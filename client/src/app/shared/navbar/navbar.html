<div class="navbar bg-base-200 shadow-sm px-6">
  <div class="flex-1">
    <a routerLink="/" class="btn btn-ghost text-2xl font-bold">CourseTracker</a>
  </div>

  <div class="flex gap-2 items-center">
    <a routerLink="/" routerLinkActive="btn-primary" [routerLinkActiveOptions]="{ exact: true }" class="btn btn-ghost text-base font-semibold">Home</a>
    <a routerLink="/contact" routerLinkActive="btn-primary" class="btn btn-ghost text-base font-semibold">Contact</a>
    <a routerLink="/disclaimer" routerLinkActive="btn-primary" class="btn btn-ghost text-base font-semibold">Disclaimer</a>

    @if (accountService.currentUser()) {
      <a routerLink="/courses" routerLinkActive="btn-primary" class="btn btn-ghost text-base font-semibold">Courses</a>

      <span class="text-sm">
        Welcome, {{ accountService.currentUser()?.displayName }}
      </span>

      <button class="btn btn-outline" (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login" routerLinkActive="btn-primary" class="btn btn-outline">Login</a>
      <a routerLink="/register" routerLinkActive="btn-primary" class="btn btn-primary">Register</a>
    }
  </div>
</div>
