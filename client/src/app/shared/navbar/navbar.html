<div class="navbar bg-[#29235c] text-white shadow-lg">
  <div class="flex-1">
    <a routerLink="/" class="text-3xl font-bold text-white">
      CourseTracker
    </a>
  </div>

  <div class="flex gap-4 items-center">

    @if (!accountService.currentUser()) {

      <a
        routerLink="/"
        routerLinkActive="text-green-400 border-b-2 border-green-400"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-lg font-medium text-white hover:text-green-400 transition duration-200 pb-1"
      >
        Home
      </a>

      <a
        routerLink="/contact"
        routerLinkActive="text-green-400 border-b-2 border-green-400"
        class="text-lg font-medium text-white hover:text-green-400 transition duration-200 pb-1"
      >
        Contact
      </a>

      <a
        routerLink="/disclaimer"
        routerLinkActive="text-green-400 border-b-2 border-green-400"
        class="text-lg font-medium text-white hover:text-green-400 transition duration-200 pb-1"
      >
        Disclaimer
      </a>

      <a
        routerLink="/login"
        class="btn btn-outline border-white text-white hover:bg-white hover:text-[#29235c]"
      >
        Login
      </a>

      <a
        routerLink="/register"
        class="btn bg-white text-[#29235c] border-none hover:bg-purple-100"
      >
        Register
      </a>

    }

    @if (accountService.currentUser()) {

      <a
        routerLink="/courses"
        routerLinkActive="text-green-400 border-b-2 border-green-400"
        class="text-lg font-medium text-white hover:text-green-400 transition duration-200 pb-1"
      >
        Courses
      </a>

      <span class="text-base font-medium">
        Welcome, {{ accountService.currentUser()?.displayName }}
      </span>

      <button
        class="btn btn-outline btn-primary"
        (click)="logout()">
        Logout
      </button>

    }

  </div>
</div>
