@if (busyService.isBusy()) {
  <div class="fixed inset-0 bg-black/20 z-40 flex items-center justify-center">
    <div class="bg-base-100 rounded-box p-6 shadow-xl flex flex-col items-center gap-3">
      <span class="loading loading-spinner loading-lg text-primary"></span>
      <p class="font-semibold">Loading...</p>
    </div>
  </div>
}
