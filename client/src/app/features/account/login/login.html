<div class="card bg-base-100 shadow-xl max-w-md mx-auto">
  <div class="card-body">
    <h2 class="card-title text-3xl justify-center">Login</h2>

    <form #loginForm="ngForm" (ngSubmit)="login()" class="space-y-4">
      <input
        name="username"
        [(ngModel)]="model.username"
        type="text"
        placeholder="Username"
        class="input input-bordered w-full"
        required
      />

      <input
        name="password"
        [(ngModel)]="model.password"
        type="password"
        placeholder="Password"
        class="input input-bordered w-full"
        required
      />

      <button class="btn btn-primary w-full" [disabled]="!loginForm.valid">
        Login
      </button>
    </form>

    <p class="text-center mt-4">
      No account?
      <a routerLink="/register" class="link link-primary">Register here</a>
    </p>
  </div>
</div>
