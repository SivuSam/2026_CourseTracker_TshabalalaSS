<div class="card bg-base-100 shadow-xl max-w-md mx-auto">
  <div class="card-body">
    <div class="flex justify-center mb-4">
      <div class="w-14 h-14 rounded-full bg-purple-100 flex items-center justify-center text-2xl">
        🔒
      </div>
    </div>
    <h2 class="card-title text-3xl justify-center">Login</h2>

    <form #loginForm="ngForm" (ngSubmit)="login()" class="space-y-4">
      <input #username="ngModel" name="username" [(ngModel)]="model.username" type="text" placeholder="Enter username"
        class="input input-bordered w-full" required />

      @if (username.invalid && username.touched) {
      <div class="text-error text-sm">
        Username is required.
      </div>
      }

      <input #password="ngModel" name="password" [(ngModel)]="model.password" type="password"
        placeholder="Enter password" class="input input-bordered w-full" required />

      @if (password.invalid && password.touched) {
      <div class="text-error text-sm">
        Password is required.
      </div>
      }

      <button class="btn btn-primary w-full" [disabled]="!loginForm.valid">
        Login
      </button>
    </form>

    <p class="text-center mt-4">
      Don't have an account?
      <a routerLink="/register" class="font-bold text-primary hover:underline">
        Register here
      </a>
    </p>
  </div>
</div>
