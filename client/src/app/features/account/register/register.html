<div class="card bg-base-100 shadow-xl max-w-md mx-auto">
  <div class="card-body">
    <h2 class="card-title text-3xl justify-center">Register</h2>

    <form #registerForm="ngForm" (ngSubmit)="register()" class="space-y-4">
      <input
        name="username"
        [(ngModel)]="model.username"
        type="text"
        placeholder="Username"
        class="input input-bordered w-full"
        required
      />

      <input
        name="displayName"
        [(ngModel)]="model.displayName"
        type="text"
        placeholder="Display name"
        class="input input-bordered w-full"
        required
      />

      <input
        name="email"
        [(ngModel)]="model.email"
        type="email"
        placeholder="Email address"
        class="input input-bordered w-full"
        required
      />

      <input
        name="password"
        [(ngModel)]="model.password"
        type="password"
        placeholder="Password"
        class="input input-bordered w-full"
        required
      />

      <button class="btn btn-primary w-full" [disabled]="!registerForm.valid">
        Register
      </button>
    </form>

    <p class="text-center mt-4">
      Already registered?
      <a routerLink="/login" class="link link-primary">Login here</a>
    </p>
  </div>
</div>
